{% extends "core/base.html" %}

{% block title %}Sign up | Nomad Postcards{% endblock %}

{% block content %}
<section class="auth-page container">
    <div class="auth-card">
        <nav class="auth-tabs" aria-label="Account">
            <a href="{% url 'login' %}">Log in</a>
            <a href="{% url 'core:register' %}" class="active" aria-current="page">Sign up</a>
        </nav>
        <p class="eyebrow">Join the club</p>
        <h1>Sign up</h1>
        <form class="auth-form" method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Create account</button>
        </form>
    </div>
</section>
{% endblock %}
