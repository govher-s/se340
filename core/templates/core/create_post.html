{% extends "core/base.html" %}

{% block title %}Write a story | Nomad Postcards{% endblock %}

{% block content %}
<section class="auth-page container">
    <div class="auth-card write-card">
        <a class="back-link" href="{% url 'core:home' %}">← Back to explore</a>
        <p class="eyebrow">Posting as @{{ user.username }}</p>
        <h1>Write a story</h1>
        <form class="auth-form" method="post" enctype="multipart/form-data">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Publish post</button>
        </form>
    </div>
</section>
{% endblock %}
